[project]
name = "job-search-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "fastapi>=0.115.0",
    "langchain[openai]>=1.3.15",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "uvicorn>=0.30.0",
]

[project.scripts]
job-search-ai-agent = "job_search_ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
